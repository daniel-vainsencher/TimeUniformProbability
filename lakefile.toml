name = "concentration_of_measure_in_lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TimeUniformProbability"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master-2026-09-17"

[[lean_lib]]
name = "TimeUniformProbability"
